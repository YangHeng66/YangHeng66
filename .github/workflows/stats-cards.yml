name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARD_STYLE: theme=transparent&hide_border=true&title_color=8b5cf6&icon_color=ec4899
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&include_all_commits=true&${{ env.CARD_STYLE }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.CARD_STYLE }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin interview-coder-cn
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=interview-coder-cn&${{ env.CARD_STYLE }}
          path: profile/pin-interview-coder-cn.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin vscode-daily-report
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=vscode-daily-report&${{ env.CARD_STYLE }}
          path: profile/pin-vscode-daily-report.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin 360-browser-debugger
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=360-browser-debugger&${{ env.CARD_STYLE }}
          path: profile/pin-360-browser-debugger.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin vue3-websocket-chat
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=vue3-websocket-chat&${{ env.CARD_STYLE }}
          path: profile/pin-vue3-websocket-chat.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: 更新主页统计卡片" || exit 0
          git push
